services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rideshare
      MYSQL_USER: rideshare
      MYSQL_PASSWORD: rideshare_local
      MYSQL_ROOT_PASSWORD: root_local
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      PORT: 8080
      DB_URL: ${DB_URL:-jdbc:postgresql://dpg-dc24mfijnfac73ab76jg-a.oregon-postgres.render.com:5432/pooling?sslmode=require}
      DB_USER: ${DB_USER:-pooling_user}
      DB_PASSWORD: ${DB_PASSWORD:-8ojnjl0QCEPpMRug99ysPjwCJ95YoX18}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@commonway.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-local-dev-change-this-secret-before-deploying-2026}
      DRIVER_VERIFICATION_API_KEY: ${DRIVER_VERIFICATION_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-openstreetmap}
      CORS_ORIGIN: http://localhost:5173
    expose: ["8080"]
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [gateway]
volumes:
  mysql-data:
