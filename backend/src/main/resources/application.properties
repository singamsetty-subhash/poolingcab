# ===================================================================
# Application & Server Configuration
# ===================================================================
spring.application.name=rideshare-api
server.port=${PORT:8080}
server.error.include-message=always

# ===================================================================
# Database / Datasource Configuration (Render PostgreSQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-dc24mfijnfac73ab76jg-a.oregon-postgres.render.com:5432/pooling?sslmode=require}
spring.datasource.username=${DB_USER:pooling_user}
spring.datasource.password=${DB_PASSWORD:8ojnjl0QCEPpMRug99ysPjwCJ95YoX18}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================================================
# Flyway Migration Configuration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===================================================================
# H2 Console (Disabled for MySQL)
# ===================================================================
spring.h2.console.enabled=false

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# Security & Authentication Configuration
# ===================================================================
app.admin.email=${ADMIN_EMAIL:admin@rideshare.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.jwt.secret=${JWT_SECRET:local-dev-change-this-secret-before-deploying-2026}
# ===================================================================
# External Provider Integrations
# ===================================================================
app.verification.provider-key=${DRIVER_VERIFICATION_API_KEY:}
app.payment.provider-key=${RAZORPAY_KEY_ID:}
app.payment.provider-secret=${RAZORPAY_KEY_SECRET:}
app.maps.provider=openstreetmap
# ===================================================================
# CORS Configuration
# ===================================================================
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
